services:
  mcp:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mcp_access:/app/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  mcp_access:
